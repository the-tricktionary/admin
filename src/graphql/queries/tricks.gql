query Tricks ($discipline: Discipline, $searchQuery: String, $filter: TrickFilter) {
  tricks (discipline: $discipline, searchQuery: $searchQuery, filter: $filter) {
    id
    slug
    discipline
    trickType
    en: localisation {
      id
      name
    }
    ttLevels: levels (rulesId: "tricktionary") {
      id
      level
    }
  }
}
