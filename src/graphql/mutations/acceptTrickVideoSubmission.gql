mutation AcceptTrickVideoSubmission ($submissionId: ID!, $data: AcceptTrickVideoSubmissionInput!) {
  acceptTrickVideoSubmission (submissionId: $submissionId, data: $data) {
    id
    status
    trick {
      id
      videos {
        host
        videoId
        type
        slowMoStart
        attribution {
          name
        }
      }
    }
  }
}
